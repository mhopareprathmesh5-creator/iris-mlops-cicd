global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: iris-app                 # Flask app deployed by Jenkins
    metrics_path: /metrics
    static_configs:
      - targets: ["iris-app:5000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
